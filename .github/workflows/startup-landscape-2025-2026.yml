name: Startup Landscape 2025-2026

on:
  pull_request:
    branches: [master]
    paths:
      - 'startup_batch/**'
      - '.github/workflows/startup-landscape-2025-2026.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create package manifest
        working-directory: startup_batch
        run: |
          cat > package.json <<'JSON'
          {
            "name": "startup-landscape-research",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": {"collect": "node collect.mjs"},
            "dependencies": {
              "csv-stringify": "^6.5.2",
              "playwright": "^1.55.0"
            }
          }
          JSON
      - name: Install dependencies and browser
        working-directory: startup_batch
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Collect startup universe
        working-directory: startup_batch
        run: npm run collect
      - name: Upload dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-landscape-2025-2026
          path: startup_batch/output/
          if-no-files-found: warn
          retention-days: 7
